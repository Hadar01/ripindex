name: Release

on:
  push:
    tags: ["v*"]
  # Lets you rehearse the whole matrix against an existing tag without
  # cutting a release: artifacts are uploaded to the run, not published.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build"
        required: true
        default: main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Cross-compiled rather than built on an ARM runner, deliberately:
          # every dependency here is pure Rust (no `cc` in Cargo.lock), so a
          # linker is all that's needed - and this works on private repos and
          # any plan, where hosted ARM runners may not.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-latest
          # Apple's toolchain targets both arches natively, so the Intel
          # build cross-compiles from the same (ARM) runner.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --bin ripindex --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          stage="ripindex-${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ripindex.exe" "$stage/"
          else
            cp "target/${{ matrix.target }}/release/ripindex" "$stage/"
            strip "$stage/ripindex" 2>/dev/null || true
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$stage/"
          cp docs/FORMAT.md "$stage/FORMAT.md"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$stage.zip" "$stage" >/dev/null
            asset="$stage.zip"
          else
            tar czf "$stage.tar.gz" "$stage"
            asset="$stage.tar.gz"
          fi
          # Checksums are generated next to the asset and published with it, so
          # the installers can verify what they downloaded.
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ripindex-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 | sed 's|artifacts/||' > SHA256SUMS
          rm -f *.sha256
          cp ../install.sh ripindex-installer.sh
          cp ../install.ps1 ripindex-installer.ps1
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS / Linux**
            ```sh
            curl -LsSf https://github.com/hadar01/ripindex/releases/latest/download/ripindex-installer.sh | sh
            ```

            **Windows**
            ```powershell
            irm https://github.com/hadar01/ripindex/releases/latest/download/ripindex-installer.ps1 | iex
            ```

            **Cargo**
            ```sh
            cargo install ripindex
            ```

            Verify a download against `SHA256SUMS`. See CHANGELOG.md for what changed.
